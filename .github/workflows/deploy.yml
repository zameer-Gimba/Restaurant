name: Deploy website to Firebase Hosting

# Every push to main publishes public/ to https://quickzu-app.web.app.
# Firestore rules are NOT deployed here; use `npm run deploy:rules` for those.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: quickzu-app
          channelId: live
